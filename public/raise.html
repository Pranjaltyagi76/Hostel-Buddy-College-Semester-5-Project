<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raise a Complaint — Hostel Buddy</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app-nav"></div>
  <div class="container">
    <div class="page-head"><h1>Raise a Complaint</h1></div>

    <div class="card" style="max-width: 640px;">
      <div id="formError" class="alert alert-error"></div>
      <div id="formSuccess" class="alert alert-success"></div>

      <form id="complaintForm" novalidate>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="" disabled selected>Select a category…</option>
          </select>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" required maxlength="1000" placeholder="Describe the issue in detail…"></textarea>
          <div class="hint"><span id="charCount">0</span>/1000 characters</div>
        </div>
        <div class="form-group">
          <label for="image">Attach an image <span class="muted">(optional)</span></label>
          <input type="file" id="image" accept="image/png,image/jpeg,image/webp">
          <div class="hint">PNG, JPEG or WEBP, up to 5 MB.</div>
        </div>
        <div class="form-group">
          <label for="video">Attach a video <span class="muted">(optional)</span></label>
          <input type="file" id="video" accept="video/mp4,video/webm">
          <div class="hint">MP4 or WEBM, up to 30 MB. Useful for faults you can only show in motion — a flickering light or a dripping pipe.</div>
        </div>
        <button type="submit" class="btn" id="submitBtn">Submit Complaint</button>
        <a class="btn btn-ghost" href="dashboard.html">Cancel</a>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/raise.js"></script>
</body>
</html>
