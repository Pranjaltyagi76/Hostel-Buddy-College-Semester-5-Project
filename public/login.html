<!DOCTYPE html>
<html lang="en" data-requires="guest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Hostel Buddy</title>
  <!-- Loaded from <head>, before the stylesheet and before any page markup:
       a failed check must navigate away before the body is parsed. -->
  <script src="js/auth.js"></script>
  <script src="js/guard.js"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand-lg">🏠 Hostel Buddy</div>
      <div class="subtitle">Sign in to your account</div>

      <div id="formError" class="alert alert-error"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required placeholder="you@hostel.test">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-navy btn-block" id="submitBtn">Sign In</button>
      </form>

      <div class="auth-switch">New student? <a href="register.html">Create an account</a></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
