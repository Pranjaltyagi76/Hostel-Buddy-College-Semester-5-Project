<!DOCTYPE html>
<html lang="en" data-requires="staff">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students — Hostel Buddy Admin</title>
  <!-- Loaded from <head>, before the stylesheet and before any page markup:
       a failed check must navigate away before the body is parsed. -->
  <script src="js/auth.js"></script>
  <script src="js/guard.js"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app-nav"></div>
  <div class="container">
    <div class="page-head">
      <h1>Students</h1>
      <p class="muted">Every student account registered on Hostel Buddy.</p>
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="form-group grow">
          <label for="search">Search</label>
          <input type="text" id="search" placeholder="Name, email, or room number…">
        </div>
        <div class="form-group">
          <label>&nbsp;</label>
          <button class="btn btn-ghost" id="clearBtn">Clear</button>
        </div>
      </div>
      <div id="resultArea"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin-students.js"></script>
</body>
</html>
