<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Buddy</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7fb; color: #1a1a1a;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; padding: 40px 48px; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.08);
            text-align: center; max-width: 420px; }
    h1 { color: #1f4e79; margin: 0 0 6px; }
    p  { color: #555; }
    .badge { display: inline-block; background: #eef4fb; color: #2e75b6; padding: 4px 12px;
             border-radius: 12px; font-size: 13px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏠 Hostel Buddy</h1>
    <p>Smart Hostel Complaint Management System</p>
    <span class="badge">Backend is running — frontend coming in Phase 5</span>
  </div>
</body>
</html>
