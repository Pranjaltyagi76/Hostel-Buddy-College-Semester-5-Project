  <!-- ============ legend / notes ============ -->
  <rect x="510" y="746" width="330" height="284" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="526" y="770" font-size="12.5" font-weight="700" fill="#1f4e79">Design notes</text>

  <text x="526" y="794" font-size="10.5" font-weight="700" fill="#333">DN-1 · Shared primary key</text>
  <text x="526" y="808" font-size="10" fill="#555">Each subtype's PK is also its FK to USER,</text>
  <text x="526" y="821" font-size="10" fill="#555">so a user cannot have two identities.</text>

  <text x="526" y="843" font-size="10.5" font-weight="700" fill="#333">DN-2 · Discriminator consistency</text>
  <text x="526" y="857" font-size="10" fill="#555">USER.role says which subtype row exists.</text>
  <text x="526" y="870" font-size="10" fill="#555">Both are written in one transaction by the</text>
  <text x="526" y="883" font-size="10" fill="#555">service layer — SQL alone cannot enforce it.</text>

  <text x="526" y="905" font-size="10.5" font-weight="700" fill="#333">DN-3 · Why COMPLAINT stores hostel_id</text>
  <text x="526" y="919" font-size="10" fill="#555">It records the hostel the complaint was</text>
  <text x="526" y="932" font-size="10" fill="#555">raised against, at that time. If a student</text>
  <text x="526" y="945" font-size="10" fill="#555">later moves hostel, history stays correct.</text>
  <text x="526" y="958" font-size="10" fill="#555">It also makes manager scoping one indexed</text>
  <text x="526" y="971" font-size="10" fill="#555">column instead of a join.</text>

  <text x="526" y="993" font-size="10.5" font-weight="700" fill="#333">DN-4 · Only students may complain</text>
  <text x="526" y="1007" font-size="10" fill="#555">student_id references STUDENT, not USER —</text>
  <text x="526" y="1020" font-size="10" fill="#555">so the database itself blocks a manager.</text>

  <!-- verification strip -->
  <rect x="20" y="1050" width="820" height="60" rx="6" fill="#eef7ef" stroke="#5a8f4e" stroke-width="1.4"/>
  <text x="36" y="1072" font-size="11.5" font-weight="700" fill="#2f6b2f">Verified in Phase A</text>
  <text x="36" y="1090" font-size="10.5" fill="#333">All 6 tables create cleanly on SQLite. Constraints tested and confirmed blocking: complaint by a non-student, invalid role,</text>
  <text x="36" y="1104" font-size="10.5" fill="#333">duplicate roll_no, duplicate email, unknown hostel, invalid status, zero capacity. Manager hostel-scoping query returns correctly.</text>

  <text x="430" y="1140" text-anchor="middle" font-size="10" fill="#888">Phase A draft — schema not yet applied to the running application (that is Phase B)</text>
