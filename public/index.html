<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Buddy — Complaint Management</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
            background: linear-gradient(135deg, #1f4e79 0%, #2e75b6 100%); }
    .hero-card { background: #fff; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
                 max-width: 560px; width: 100%; padding: 46px 40px; text-align: center; }
    .hero-card h1 { font-size: 2.2rem; margin-bottom: 6px; }
    .hero-card .tag { color: var(--muted); font-size: 1.05rem; margin-bottom: 26px; }
    .hero-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .hero-actions .btn { padding: 12px 28px; font-size: 1rem; }
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 30px; text-align: center; }
    .feature { font-size: .85rem; color: #475569; }
    .feature .ico { font-size: 1.6rem; display: block; margin-bottom: 4px; }
    @media (max-width: 520px) { .features { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-card">
      <h1>🏠 Hostel Buddy</h1>
      <p class="tag">Smart Hostel Complaint Management System</p>
      <div class="hero-actions">
        <a class="btn btn-navy" href="login.html">Login</a>
        <a class="btn btn-ghost" href="register.html">Register as Student</a>
      </div>
      <div class="features">
        <div class="feature"><span class="ico">📝</span>Raise complaints online</div>
        <div class="feature"><span class="ico">🔎</span>Track status in real time</div>
        <div class="feature"><span class="ico">📊</span>Admin dashboard &amp; analytics</div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
